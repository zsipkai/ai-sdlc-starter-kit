name: Required SDLC Gate

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdlc-gate:
    name: sdlc-gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Add the minimal language and dependency setup required by your project.
      # Keep the actual policy in scripts/sdlc-gate.sh so local and CI checks agree.

      - name: Run full SDLC gate
        run: bash scripts/sdlc-gate.sh --full
